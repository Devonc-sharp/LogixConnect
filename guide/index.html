<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logix Connect Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
</head><body><style>
/* Layout: a control-cabinet reading desk. Contents rail on the left like the Controller Organizer; the lesson in a serif column; rungs drawn live on drafting-sheet cards; a small operator console docked with the lesson. */
:root{
  --paper:#f4f6f8; --sheet:#ffffff; --ink:#18202b; --muted:#5a6573; --rule:#d9dfe6; --grid:#eef2f6;
  --blue:#1d4f91; --blue-soft:#e8eef7; --power:#1f9d55; --power-soft:#e3f4ea; --wire:#4a5563;
  --amber:#c9631a; --amber-soft:#fbf1e7; --violet:#6a4cc0; --violet-soft:#f4f0fd; --green-soft:#ecf6ef;
  --lamp-off:#c8ced6; --code:#f1f4f7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161d; --sheet:#171e27; --ink:#e3e8ee; --muted:#97a3b1; --rule:#2a3440; --grid:#1c242e;
  --blue:#7fa9e6; --blue-soft:#1b2a3f; --power:#3ccf7c; --power-soft:#14301f; --wire:#9aa6b3;
  --amber:#e8954f; --amber-soft:#2e2116; --violet:#a891f0; --violet-soft:#231d38; --green-soft:#16271d;
  --lamp-off:#3a4552; --code:#1d2530; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161d; --sheet:#171e27; --ink:#e3e8ee; --muted:#97a3b1; --rule:#2a3440; --grid:#1c242e;
  --blue:#7fa9e6; --blue-soft:#1b2a3f; --power:#3ccf7c; --power-soft:#14301f; --wire:#9aa6b3;
  --amber:#e8954f; --amber-soft:#2e2116; --violet:#a891f0; --violet-soft:#231d38; --green-soft:#16271d;
  --lamp-off:#3a4552; --code:#1d2530; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
code,.mono{font-family:var(--f-mono);font-size:.84em}
code{background:var(--code);padding:.05em .3em;border-radius:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
/* the contents rail */
.rail{background:var(--sheet);border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding:18px 0 40px}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--rule)}
.brand .mark{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.02em;color:var(--blue);line-height:1}
.brand .sub{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.search{margin:14px 18px 6px;position:relative}
.search input{width:100%;font:15px var(--f-body);padding:8px 10px 8px 30px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.toc{list-style:none;margin:6px 0 0;padding:0}
.toc .part{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px}
.toc a,.toc span.ch{display:grid;grid-template-columns:28px 1fr;gap:4px;padding:4px 18px;font-size:14.5px;line-height:1.35;color:var(--ink);text-decoration:none}
.toc span.ch{color:var(--muted);opacity:.7}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.toc a.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.toc .hit{background:var(--amber-soft)}
.toc .none{padding:10px 18px;color:var(--muted);font-size:14px}
.menu-btn{display:none}
/* the lesson */
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:780px;margin:0 auto}
.crumb{font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1.02;margin:.15em 0 .5em;text-wrap:balance;letter-spacing:.005em}
h1 .num{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:16px;letter-spacing:0;color:#fff;background:var(--blue);border-radius:2px;padding:3px 8px;vertical-align:middle;margin-right:12px;position:relative;top:-6px}
h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:1.7em 0 .4em;color:var(--blue);text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin:1.6em 0 .5em;color:var(--ink)}
p{margin:0 0 .9em}
.dim{color:var(--muted)}
.box{border-radius:3px;padding:14px 18px;margin:1.1em 0;border:1px solid var(--rule)}
.box .ttl{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.app{background:var(--sheet);border-left:3px solid var(--blue)}.box.app .ttl{color:var(--blue)}
.box.try{background:var(--sheet);border-left:3px solid var(--power)}.box.try .ttl{color:var(--power)}
.box.watch{background:var(--sheet);border-left:3px solid var(--amber)}.box.watch .ttl{color:var(--amber)}
.box.think{background:var(--sheet);border-left:3px solid var(--power)}
.tbl{overflow-x:auto;margin:.6em 0 1.2em}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;text-align:left;color:var(--muted);border-bottom:2px solid var(--rule);padding:6px 10px}
td{border-bottom:1px solid var(--rule);padding:7px 10px;vertical-align:top}
td.m{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
/* the console: a painted steel operator station (RAL 7035) with 22 mm pilot devices and engraved legend plates; a physical object, so its colours do not follow the theme */
.console{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin:1.2em 0 1.6em;background:linear-gradient(180deg,#d9dcdb 0%,#cfd2d1 55%,#c3c7c6 100%);color:#1c2126;border:1px solid #8f9596;border-radius:4px;padding:14px 22px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;box-shadow:inset 0 1px 0 #f1f3f2,inset 0 -1px 0 #a9aeae,0 2px 6px rgba(0,0,0,.18)}
.console::before,.console::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f5f5,#8d9394 70%);box-shadow:0 0 0 1px #7b8182}
.console::before{left:7px}.console::after{right:7px}
.console .plate{margin-right:auto;align-self:center;background:#15181c;color:#e9ecee;border-radius:2px;padding:5px 10px 6px;font-family:var(--f-display);font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase;line-height:1.25;box-shadow:inset 0 0 0 1px #3a4047}
.console .plate b{display:block;font-size:14px;letter-spacing:.1em;color:#fff}
.dev{display:flex;flex-direction:column;align-items:center;gap:6px}
.dev .lg{background:#15181c;color:#f2f4f5;font:600 10.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:2px 7px 3px;border-radius:1.5px;box-shadow:inset 0 0 0 1px #3a4047;white-space:nowrap}
/* a pilot device: chrome bezel ring, then the actuator or lens */
.pb,.lamp{width:46px;height:46px;border-radius:50%;padding:6px;background:conic-gradient(from 210deg,#f6f7f7,#9aa0a2 18%,#e9ebeb 36%,#7f8587 55%,#dfe2e2 72%,#8b9193 88%,#f6f7f7);box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px #6f7577;cursor:pointer;touch-action:none;user-select:none}
.lamp{cursor:default}
.pb i,.lamp i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 4px rgba(0,0,0,.28);transition:box-shadow .06s,transform .06s,background .1s}
.pb.green i{background:radial-gradient(circle at 40% 32%,#3f9a5c,#1f7a3f 62%,#17602f)}
.pb.red i{background:radial-gradient(circle at 40% 32%,#c94a40,#a82a23 62%,#86201b)}
.pb.black i{background:radial-gradient(circle at 40% 32%,#4a4f55,#2a2e33 62%,#1c1f23)}
.pb.down i,.pb.set i{transform:scale(.94);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 4px 6px rgba(0,0,0,.5)}
.pb.set{box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px #6f7577,0 0 0 2px #c98a2b}
.lamp i{background:radial-gradient(circle at 40% 32%,#2f5a3d,#1d3c28 65%,#142a1c)}
.lamp.on i{background:radial-gradient(circle at 42% 36%,#d9ffe6,#57d586 38%,#25a455 75%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 7px rgba(70,210,125,.55)}
.key{display:flex;border-radius:2px;overflow:hidden;border:1px solid #5d6366;height:30px;margin-bottom:22px;box-shadow:inset 0 1px 0 #f1f3f2}
.key button{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;background:#e4e6e6;color:#4a5054;border:0;padding:0 11px;cursor:pointer}
.key button.on{background:#15181c;color:#fff}
.scan{font-family:var(--f-mono);font-size:11.5px;color:#4a5054;min-width:92px;text-align:right;margin-bottom:28px}
/* a rung */
.rung{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;margin:1.4em 0;overflow:hidden}
.rung header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 16px 4px}
.rung .lbl{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--blue);text-transform:uppercase}
.rung .state{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:1px 8px;border-radius:2px;background:var(--grid);color:var(--muted)}
.rung .state.true{background:var(--power-soft);color:var(--power)}
.rung .cmt{padding:0 16px 6px;font-size:15px;color:var(--muted);font-style:italic}
.ladder{overflow-x:auto;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 100%;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ladder svg{display:block;min-width:640px;width:100%;height:auto}
.ladder .el{cursor:pointer}
.ladder .el:hover .hov{fill:var(--blue-soft)}
.rt{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;background:var(--code)}
.rt code{background:none;padding:0;font-size:13.5px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.btn{font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:3px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.predict{margin:12px 16px;border:1px solid var(--rule);border-left:3px solid var(--violet);background:var(--sheet);border-radius:3px;padding:12px 14px}
.predict .ttl{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;text-transform:uppercase;color:var(--violet);margin-bottom:4px}
.predict .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.predict .ans{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.verdict{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.verdict.right{color:var(--power)}.verdict.wrong{color:var(--amber)}
details.how{margin:0 16px 14px;border-top:1px solid var(--rule)}
details.how summary{cursor:pointer;list-style:none;padding:10px 0;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;text-transform:uppercase;color:var(--blue)}
details.how summary::before{content:"▸ ";}
details.how[open] summary::before{content:"▾ ";}
details.how .body{font-size:15.5px}
details.how ol{padding-left:1.4em;margin:.2em 0 .6em}
details.how li{margin:.18em 0}
details.how .path{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;color:var(--blue);font-size:14px;margin-top:4px}
details.how .sub{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:.8em 0 .2em}
details.how i.dim{font-style:normal;font-family:var(--f-display);letter-spacing:.04em}
/* Run it checklist */
.checks{list-style:none;padding:0;margin:.4em 0 0}
.checks li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:4px 0}
.tick{width:18px;height:18px;border-radius:2px;border:1.5px solid var(--wire);margin-top:3px;display:grid;place-items:center;font-size:12px;color:#fff;transition:background .2s}
.checks li.done .tick{background:var(--power);border-color:var(--power)}
.checks li.done .txt{color:var(--power)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:3em;border-top:1px solid var(--rule);padding-top:16px;flex-wrap:wrap}
.pager .p{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pager .p b{display:block;font-size:18px;letter-spacing:.02em;text-transform:none;color:var(--ink)}
mark{background:var(--amber-soft);color:inherit;box-shadow:0 0 0 2px var(--amber-soft)}
.theme{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);transform:translateX(-102%);transition:transform .2s;z-index:30;box-shadow:0 0 30px rgba(0,0,0,.25);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex;margin-bottom:10px}
  h1{font-size:34px}
  .console{gap:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- the rest of the book's furniture ---- */
.col{max-width:820px}
#lesson.loading{opacity:.45}
.prose img{max-width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:2px;background:#fff}
figure{margin:1em 0 1.5em}
figcaption{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
figure.narrow img,figure.phone img{max-height:620px;width:auto}
figure.third img{width:min(100%,380px)}
figure.diagram{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:10px;overflow-x:auto}
figure.diagram svg{display:block;width:100%;min-width:520px;height:auto}
figure.diagram figcaption{color:#5a6573}
.grid{display:grid;gap:14px;margin:1em 0 1.5em;align-items:start;grid-template-columns:repeat(2,1fr)}
.grid figure{margin:0}
.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g5{grid-template-columns:repeat(5,1fr)}
.kbd,td.kbdcell{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.kbd{border:1px solid var(--rule);border-radius:3px;padding:0 5px;background:var(--sheet)}
pre.rt,pre.listing{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--code);border-left:3px solid var(--blue);padding:10px 14px;margin:.4em 0 1.1em;white-space:pre-wrap;word-break:break-word;border-radius:0 3px 3px 0;display:block}
pre.listing{font-size:12.5px;max-height:560px;overflow:auto}
pre.listing .n{color:var(--muted);user-select:none}
.rtcap{font-style:italic;font-size:14.5px;color:var(--muted);margin-bottom:2px}
ul.menu li,ul.layout li{margin:.45em 0}
ul.layout .note{color:var(--muted);font-style:italic}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 .9em}
.prose li{margin:.2em 0}
.prose a{color:var(--blue)}
.prose figcaption code,.prose p code,.prose li code,.prose td code,.prose dd code{overflow-wrap:anywhere}
.part h3{margin-top:2em;padding-top:1em;border-top:1px solid var(--rule);text-transform:none;letter-spacing:.02em;font-size:22px;color:var(--blue)}
.box.note{background:var(--sheet);border-left:3px solid var(--wire)}
dl.gloss dt{font-weight:600;margin-top:.7em}
dl.gloss dt.gl{font-family:var(--f-display);font-size:30px;color:var(--blue);margin-top:1em;border-bottom:1px solid var(--rule)}
dl.gloss dd{margin:0 0 0 1.2em;font-size:16px}
table.log td{height:2.4em}
/* the controller strip on chapters without an operator station */
#strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6}
#strip .console{position:relative;top:0}
.runbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--power);border-radius:3px;padding:8px 14px;margin:1em 0 1.4em}
.runbar .rb-t{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
.runbar .key{margin:0;height:28px}.runbar .scan{margin:0;color:var(--muted);text-align:left;min-width:80px}
.runbar .rb-h{flex-basis:100%;font-size:14px;color:var(--muted);line-height:1.35}
.rung .note{font-size:13px;color:var(--amber);font-style:italic}
.vals{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.vals[hidden]{display:none}
.vals label{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px}
.vals input{width:92px;font:13px var(--f-mono);padding:4px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.toc a small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.3;margin-top:2px}
.pager a.p{text-decoration:none}.pager a.p:hover b{color:var(--blue)}
@media (max-width:700px){.grid.g3,.grid.g4,.grid.g5{grid-template-columns:repeat(2,1fr)} #strip{position:static}}
/* the contents rail folds away: « in its header, ☰ Contents brings it back (remembered on this device) */
.brand{position:relative;padding-right:52px}
.railhide{position:absolute;right:12px;top:-2px;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--muted);font:600 18px/1 var(--f-display);cursor:pointer}
.railhide:hover{color:var(--blue);border-color:var(--blue)}
@media (min-width:901px){
  body.railoff .shell{grid-template-columns:minmax(0,1fr)}
  body.railoff .rail{display:none}
  body.railoff .menu-btn{display:inline-flex;margin-bottom:10px}
  body.railoff .col{max-width:900px;margin-left:auto;margin-right:auto}
}
/* the link to Logix Connect: the chip, the progress card, the rung badges, the marks in the contents */
.lcchip{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:20;text-transform:none;letter-spacing:.02em;font-size:13px;max-width:min(560px,calc(100vw - 28px));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.lcchip[hidden]{display:none}
.lcchip .d{color:var(--muted)}.lcchip.on{color:var(--ink);border-color:var(--power)}.lcchip.on .d{color:var(--power)}
.lccard{border:1px solid var(--rule);border-left:3px solid var(--wire);border-radius:3px;background:var(--sheet);padding:10px 16px 12px;margin:1em 0 1.2em}
.lccard.live{border-left-color:var(--power)}
.lchd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px}
.lctt{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
.lcp{font-weight:600}
.lcs{font-size:13px;color:var(--muted)}.lcs.on{color:var(--power);font-weight:600}
.lcf{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
.lcdim{color:var(--muted);font-size:15px;margin:.3em 0}

/* ---------------- the link to Logix Connect ----------------
   Opened from the app (its Guided panel or menu), this window is its opener's companion: the app sends each lesson's checks, run checks and
   rungs (written, proven in Run) and this page shows them; it asks the app to go to a lesson or to add a reference rung. On one origin a
   BroadcastChannel links them even when the guide was opened by hand. The last progress is kept, so the page shows it when the app is away. */

  if(d.type === 'note'){ LINK.note = {ch: +d.ch || 0, text: String(d.text || ''), at: Date.now()}; LINK.peer = Date.now(); LINK.live = true; linkRender(); return; }

  const prev = LINK.snap; LINK.snap = d; LINK.peer = Date.now(); LINK.live = true;
  try { localStorage.setItem('lc-guide-progress', JSON.stringify(d)); } catch(e){}
  // follow the app: when its lesson changes, show that lesson's chapter
  if(LINK.follow && d.on && prev && prev.on && prev.prog === d.prog && prev.cur !== d.cur){ const L = d.lessons[d.cur]; if(L && L.ch && (!CH || CH.n !== L.ch)){ const e = TOC.find(x => x.n === L.ch); if(e) location.hash = '#' + e.id; } }
  linkRender();
}
window.addEventListener('message', e => { if(!window.opener || e.source !== window.opener) return; linkIn(e.data); });
try { LINK.bc = new BroadcastChannel('logix-guide'); LINK.bc.onmessage = e => { const d = e.data; if(d && d.type !== 'hello' && d.type !== 'here' && d.type !== 'goto' && d.type !== 'add') linkIn(d); }; } catch(e){ LINK.bc = null; }
setInterval(() => { linkHello('here'); if(LINK.live && Date.now() - LINK.peer > 12000){ LINK.live = false; linkRender(); } }, 4000);
/* Opened by the desktop app, the guide is in the browser and the app in its own window: they meet on the Logix Connect bridge
   (ws://127.0.0.1:<port>/link), which passes each message on. The app opens the guide with ?link=bridge&port=N; the tab keeps it. */
function linkHubStart(){ let port = 0; try { const q = new URLSearchParams(location.search); if(q.get('link') === 'bridge'){ port = +q.get('port') || 8787; sessionStorage.setItem('lc-guide-bridge', String(port)); } else port = +(sessionStorage.getItem('lc-guide-bridge') || 0); } catch(e){}
  if(!port) return; LINK.port = port; linkHub(); }
function linkHub(){ if(LINK.ws && LINK.ws.readyState < 2) return; let ws; try { ws = new WebSocket('ws://127.0.0.1:' + LINK.port + '/link'); } catch(e){ return; } LINK.ws = ws;
  ws.onopen = () => linkHello('hello');
  ws.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch(err){ return; } if(!d || typeof d !== 'object' || d.lc !== 'logix-guide') return;
    if(d.type === 'show'){ LINK.peer = Date.now(); LINK.live = true; const en = TOC.find(x => x.n === +d.ch); if(en){ const h = '#' + en.id + (d.rn ? ':' + d.rn + ':' + (+d.i) : ''); if(location.hash === h) showRung(hashRung()); else location.hash = h; } return; }
    if(d.type === 'hub' || d.type === 'hello' || d.type === 'here' || d.type === 'goto' || d.type === 'add') return; linkIn(d); };
  ws.onclose = () => { if(LINK.ws === ws) LINK.ws = null; setTimeout(linkHub, 5000); }; ws.onerror = () => {}; }
/* Back to the app. On a phone or iPad the guide opened from the app has no tab to switch to, so this closes the guide's window and
   the app is underneath; the place in the chapter is kept and the guide reopens there. On a computer it brings the app's window forward. */
function linkOpener(){ try { return window.opener && !window.opener.closed ? window.opener : null; } catch(e){ return null; } }
function linkSaveSpot(){ try { if(!CH) return; const S = LINK.snap, L = S && S.on && Array.isArray(S.lessons) ? S.lessons[+S.cur || 0] : null; localStorage.setItem('lc-guide-spot', JSON.stringify({id:CH.id, y:Math.round(window.scrollY), appCh:L && L.ch || 0, at:Date.now()})); } catch(e){} }
window.addEventListener('pagehide', linkSaveSpot); document.addEventListener('visibilitychange', () => { if(document.hidden) linkSaveSpot(); });
/* Reopened from the app at the same lesson (or with no chapter), the guide goes back to the chapter and place it was left at; a rung
   mark's address, or the app on another lesson, goes where it says. */
function linkRestore(){
  if(LINK.pendY != null){ const y = LINK.pendY; LINK.pendY = null; setTimeout(() => window.scrollTo(0, y), 60); return; }
  if(LINK.restored) return; LINK.restored = true; if(hashRung() || !CH) return;
  let sp = null; try { sp = JSON.parse(localStorage.getItem('lc-guide-spot') || 'null'); } catch(e){}
  if(!sp || Date.now() - sp.at > 12 * 3600e3) return;
  if(sp.id === CH.id){ if(sp.y > 0) setTimeout(() => window.scrollTo(0, sp.y), 60); return; }
  const noCh = !(location.hash || '').replace('#', '');
  if((noCh || (sp.appCh && sp.appCh === CH.n)) && TOC.some(x => x.id === sp.id)){ LINK.pendY = sp.y; location.hash = '#' + sp.id; } }
function linkToast(t){ let el = $('lcToast'); if(!el){ el = document.createElement('div'); el.id = 'lcToast'; el.className = 'lctoast'; document.body.appendChild(el); } el.textContent = t; el.classList.add('on'); clearTimeout(LINK.toastT); LINK.toastT = setTimeout(() => el.classList.remove('on'), 5000); }
function linkBackToApp(){
  const op = linkOpener(); linkSaveSpot();
  try { if(op) op.focus(); } catch(e){}
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if(op && touch){ try { window.close(); } catch(e){} setTimeout(() => { if(!window.closed) linkToast('Your device kept the guide open: use the app switcher to go back to Logix Connect.'); }, 500); return; }
  if(op){ setTimeout(() => { if(document.hasFocus()) linkToast('Switch to the Logix Connect window or tab: the browser kept this one in front.'); }, 400); return; }
  linkToast(LINK.live ? 'Logix Connect is open in another window or tab: switch to it there.' : 'Open Logix Connect and use Read it in the guide to link them.');
}
function linkWhen(t){ try { const d = new Date(t), now = new Date(); const hm = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); return d.toDateString() === now.toDateString() ? 'today ' + hm : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + hm; } catch(e){ return ''; } }
function linkLessons(n){ const S = LINK.snap; return S && S.on && Array.isArray(S.lessons) ? S.lessons.filter(L => L && L.ch === n) : []; }
function linkLessonOf(R){ if(!CH) return null; for(const L of linkLessons(CH.n)){ if(!L.rungs || !Array.isArray(L.rungs.list)) continue; const t = lnorm(R.text); if(L.rungs.list.some(x => x.t === t) || (L.rungs.rn === R.rn && L.rungs.list[R.i])) return L; } return null; }
function linkRungOf(L, R){ const t = lnorm(R.text); return L.rungs.list.find(x => x.t === t) || (L.rungs.rn === R.rn ? L.rungs.list.find(x => x.i === R.i && x.t === t) : null); }
function linkMark(n){ if(typeof n !== 'number') return ''; const ls = linkLessons(n); if(!ls.length) return ''; const done = ls.every(L => L.done), cur = ls.some(L => L.cur), some = ls.some(L => L.done || (L.rungs && L.rungs.w) || (L.checks || []).some(c => c.pass));
  return `<span class="lcm${done ? ' done' : cur ? ' cur' : some ? ' some' : ''}" title="${done ? 'Done in Logix Connect' : cur ? 'The lesson Logix Connect is on' : some ? 'Started in Logix Connect' : 'Not started in Logix Connect'}">${done ? '✓' : cur ? '●' : some ? '◐' : '○'}</span>`; }
function linkChip(){
  let b = $('lcChip'); if(!b){ b = document.createElement('button'); b.id = 'lcChip'; b.type = 'button'; b.className = 'btn lcchip'; document.body.appendChild(b); b.onclick = () => linkBackToApp(); }
  const S = LINK.snap; if(!S && !LINK.live){ b.hidden = true; return; }
  const what = S ? (S.proj || (S.on ? S.title : '')) : '', les = S && S.on && Array.isArray(S.lessons) && S.lessons.length > 1 ? ` · lesson ${(+S.cur || 0) + 1} of ${S.lessons.length}` : '';
  b.hidden = false; b.classList.toggle('on', LINK.live);
  b.innerHTML = `${LINK.live || linkOpener() ? '<span class="bk">←</span> ' : ''}<span class="d">${LINK.live ? '●' : '○'}</span> Logix Connect${what ? ' · ' + esc(what) : ''}${LINK.live ? esc(les) : ' · last seen ' + esc(linkWhen(S ? S.at : 0))}`;
  b.title = LINK.live ? 'Back to Logix Connect (' + (what || 'no project') + (S && S.on ? ', guided mode on' : ', guided mode off') + ')' : 'Not linked: this is what Logix Connect showed last. Open the guide from the app’s Guided panel to link them again.';
}
function linkRender(){
  linkChip(); buildToc($('q') ? $('q').value : '');
  const host = $('lcCard'); if(!host || !CH) return;
  const S = LINK.snap, ls = linkLessons(CH.n), live = LINK.live, hasR = RUNGS.length > 0;
  const note = LINK.note && LINK.note.ch === CH.n && Date.now() - LINK.note.at < 20000 ? `<p class="lcnote">${esc(LINK.note.text)}</p>` : '';
  const state = live ? `<span class="lcs on">● linked</span>` : S ? `<span class="lcs">○ not linked · last seen ${esc(linkWhen(S.at))}</span>` : '';
  const fol = `<label class="lcf" title="When the app moves to another lesson, show its chapter here"><input type="checkbox" id="lcFollow"${LINK.follow ? ' checked' : ''}> Follow the app</label>`;
  let body = '';
  if(!S){ if(!hasR){ host.innerHTML = ''; return; } body = `<p class="lcdim">Open this chapter from Logix Connect (the Guided panel’s <b>Read it in the guide</b>) and your progress on it shows here as you work.</p>`; }
  else if(!S.on){ if(!hasR && !note){ host.innerHTML = ''; return; } body = `<p class="lcdim">Guided mode is off in Logix Connect${S.proj ? ' (' + esc(S.proj) + ' is open)' : ''}. Start it from the app’s Guided menu to track this chapter.</p>`; }
  else if(!ls.length){ if(!hasR && !note){ host.innerHTML = ''; return; } body = `<p class="lcdim">Logix Connect has ${esc(S.proj || S.title || 'another project')} open; this chapter is not one of its lessons.</p>`; }
  else body = ls.map(L => {
    const ck = (L.checks || []).map(c => `<li class="${c.pass ? 'ok' : ''}"><span class="mk">${c.pass ? '✓' : '○'}</span>${esc(c.label)}${!c.pass && c.fix ? ' <span class="lcfix">fix button in the app</span>' : ''}</li>`).join('');
    const rn = (L.run || []).map(c => `<li class="${c.pass ? 'ok' : ''}"><span class="mk">${c.pass ? '✓' : '▶'}</span>${esc(c.label)}</li>`).join('');
    const rg = L.rungs ? `<p class="lcr"><b>${L.rungs.w} / ${L.rungs.n}</b> rungs of <code>${esc(L.rungs.rn)}</code> in your program · <b>${L.rungs.p}</b> proven in Run${L.rungs.next >= 0 ? ` · next: rung ${L.rungs.next}` : ''}</p>` : '';
    const tag = L.done ? '<span class="lct done">✓ done</span>' : L.cur ? '<span class="lct cur">the app’s lesson now</span>' : '<span class="lct">in progress</span>';
    const go = live && !L.cur ? `<button class="btn lcgo" type="button" data-lcgo="${L.ch}">Show this lesson in Logix Connect</button>` : '';
    return `<div class="lcl"><div class="lcl-h"><b>${esc(L.title)}</b>${tag}</div>${ck ? `<div class="sub">Build it</div><ul class="lcc">${ck}</ul>` : ''}${rn ? `<div class="sub">Run it</div><ul class="lcc">${rn}</ul>` : ''}${rg}${go}</div>`; }).join('');
  host.innerHTML = `<section class="lccard${live ? ' live' : ''}" aria-label="Your progress in Logix Connect"><div class="lchd"><span class="lctt">In Logix Connect</span>${S && S.proj ? `<span class="lcp">${esc(S.proj)}</span>` : ''}${state}${S && S.on ? fol : ''}</div>${live || linkOpener() ? '<button class="btn lcback" type="button" data-lcback="1">← Back to Logix Connect</button>' : ''}${note}${body}</section>`;
  const f = $('lcFollow'); if(f) f.onchange = () => { LINK.follow = f.checked; try { localStorage.setItem('lc-guide-follow', f.checked ? '1' : '0'); } catch(e){} };

  // the rungs: what the app has seen of each
  lessonEl.querySelectorAll('article.rung').forEach(a => { const R = RUNGS[+a.dataset.i]; if(!R) return; const b = a.querySelector('.lcb'), add = a.querySelector('.lcadd'); const L = linkLessonOf(R), x = L ? linkRungOf(L, R) : null;
    if(b){ if(x){ b.hidden = false; b.className = 'lcb ' + (x.p ? 'p' : x.w ? 'w' : x.away ? 'aw' : x.i === L.rungs.next ? 'nx' : ''); b.textContent = x.p ? '✓✓ proven in Run' : x.w ? '✓ in your program' : x.away ? 'written in ' + x.away : x.i === L.rungs.next ? 'next in Logix Connect' : 'not written yet'; } else b.hidden = true; }
    if(add){ add.hidden = !(live && x && !x.w && !x.away); if(!add.hidden) add.textContent = 'Add it in Logix Connect'; } });
}

/* ---------------- contents, search, routing ---------------- */
const tocEl = $('toc'); let SEARCH = null, searching = null;
function current(){ return (location.hash || '').replace('#', '').split(':')[0] || 'ch01'; }
/* #ch20:S3_Index:2 opens chapter 20 at that rung (Logix Connect's rung marks link here) */
function hashRung(){ const p = (location.hash || '').replace('#', '').split(':'); return p.length >= 3 ? {rn:decodeURIComponent(p[1]), i:+p[2]} : null; }
function showRung(t){ if(!t) return; const k = RUNGS.findIndex(R => R.rn === t.rn && R.i === t.i); if(k < 0) return; const a = lessonEl.querySelectorAll('article.rung')[k]; if(!a) return; a.scrollIntoView({block:'center'}); a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash'); }
function buildToc(filter){
  const f = (filter || '').trim().toLowerCase(), cur = CH ? CH.id : current(); tocEl.innerHTML = ''; let pending = null, shown = 0;
  for(const e of TOC){
    if(e.part){ pending = e.part; continue; }
    const label = (typeof e.n === 'number' ? e.n + ' ' : 'appendix ' + e.n + ' ') + e.t; let snip = '';
    if(f){ const inTitle = label.toLowerCase().includes(f); if(!inTitle){ if(!SEARCH || f.length < 3) continue; const txt = SEARCH[e.id] || '', at = txt.toLowerCase().indexOf(f); if(at < 0) continue; snip = '…' + txt.slice(Math.max(0, at - 30), at + f.length + 40) + '…'; } }
    if(pending){ const li = document.createElement('li'); li.className = 'part'; li.textContent = pending.replace(' — ', ' · '); tocEl.appendChild(li); pending = null; }
    const li = document.createElement('li'); shown++;
    const lm = linkMark(e.n);
    li.innerHTML = `<a href="#${e.id}" class="${e.id === cur ? 'on' : ''}"${e.id === cur ? ' aria-current="page"' : ''}><span class="n">${e.n}</span><span>${esc(e.t)}${snip ? `<small>${esc(snip)}</small>` : ''}</span>${lm}</a>`;
    tocEl.appendChild(li);
  }
  if(!shown){ const li = document.createElement('li'); li.className = 'none'; li.textContent = f.length < 3 ? 'Type at least three letters to search the text.' : (SEARCH ? 'Nothing in the guide matches.' : 'Searching…'); tocEl.appendChild(li); }
}
function clearMarks(){ lessonEl.querySelectorAll('mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent))); lessonEl.normalize(); }
function markText(q){
  if(q.length < 3) return;
  const w = document.createTreeWalker(lessonEl.querySelector('.prose') || lessonEl, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('svg,script,button,input') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const hits = []; let n; while((n = w.nextNode())){ if(n.nodeValue.toLowerCase().includes(q)) hits.push(n); if(hits.length > 200) break; }
  hits.forEach(t => { const i = t.nodeValue.toLowerCase().indexOf(q), r = document.createRange(); r.setStart(t, i); r.setEnd(t, i + q.length); const m = document.createElement('mark'); try { r.surroundContents(m); } catch(e){} });
}
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { const q = e.target.value.trim().toLowerCase();
  if(q.length >= 3 && !SEARCH && !searching){ searching = fetch('search.json').then(r => r.json()).then(d => { SEARCH = d; buildToc($('q').value); }).catch(() => { SEARCH = {}; }); }
  buildToc(q); clearMarks(); markText(q); }, 220); });
/* the contents rail folds away on a wide screen; on a narrow one it is the drawer it always was */
function wideRail(){ return window.matchMedia('(min-width:901px)').matches; }
function setRail(on){ document.body.classList.toggle('railoff', !on); try { localStorage.setItem('lc-guide-rail', on ? '1' : '0'); } catch(e){} }
try { if(localStorage.getItem('lc-guide-rail') === '0') document.body.classList.add('railoff'); } catch(e){}
$('railHide').onclick = () => { if(wideRail()) setRail(false); else $('rail').classList.remove('open'); };
document.addEventListener('click', e => { const rail = $('rail'); if(rail.classList.contains('open') && (!e.target.closest('#rail,#menuBtn') || e.target.closest('#toc a'))) rail.classList.remove('open'); });
async function route(){
  const id = current(), e = TOC.find(x => x.id === id) || TOC.find(x => x.id);
  if(CH && CH.id === e.id){ showRung(hashRung()); return; }
  lessonEl.classList.add('loading');
  try { const d = await (await fetch('ch/' + e.id + '.json')).json(); showChapter(d); const q = $('q').value.trim().toLowerCase(); if(q.length >= 3){ markText(q); const first = lessonEl.querySelector('mark'); if(first){ const dt = first.closest('details'); if(dt) dt.open = true; first.scrollIntoView({block:'center'}); } } }
  catch(err){ lessonEl.innerHTML = `<h1>${esc(e.t)}</h1><p>This chapter could not be loaded. Check the connection and choose it again from the contents.</p>`; }
  lessonEl.classList.remove('loading'); showRung(hashRung());
}
window.addEventListener('hashchange', route);
$('themeBtn').addEventListener('click', () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; });
buildToc(''); route(); linkChip(); linkHello('hello'); linkHubStart();
